# ============================================================
# AX3000T V2 固件编译工作流（stock 变体，配合 hanwckf 112M U-Boot）
# 在 fork 仓库中将此内容粘贴到 .github/workflows/manual.yml
# 然后在 Actions 页面手动触发 "Run workflow"
# ============================================================
name: Build AX3000T Firmware (stock)

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: '清理 ccache 缓存强制全量编译'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  # 只编译 AX3000T stock 这一个设备目标（标准 layout，配合 hanwckf 112M U-Boot）
  DEFCONFIG_FILE: defconfig/mt7981-ax3000.config

jobs:
  build:
    name: Compile AX3000T (stock)
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          echo "=== 释放磁盘空间 ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Setup build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync unzip zlib1g-dev \
            ccache

      - name: Cache ccache
        if: github.event.inputs.clean_cache != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-ax3000t-v2-${{ github.sha }}
          restore-keys: ccache-ax3000t-v2-

      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load defconfig
        run: |
          cp ${{ env.DEFCONFIG_FILE }} .config
          make defconfig

      - name: Show enabled device targets
        run: |
          echo "=== 已启用的设备目标 ==="
          grep -E 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y' .config || {
            echo "错误：未找到任何设备目标！defconfig 配置有误，subtarget 可能不对。"
            echo "=== 当前 .config 中所有 TARGET 相关项 ==="
            grep -E 'CONFIG_TARGET_(mediatek|DEVICE)' .config | head -30
            exit 1
          }

      - name: Download sources
        run: |
          # 下载策略：三轮重试，避开单一包卡死整批超时
          # 第一轮：并行快速下载大部分源码包（卡住的会失败但不中断）
          echo "=== 第一轮：并行下载 ==="
          make download -j$(nproc) || true
          
          # 第二轮：单线程 VERBOSE 重试失败的包，显示具体卡住的 URL 方便排查
          echo "=== 第二轮：单线程 VERBOSE 重试 ==="
          make download -j1 V=s || true
          
          # 第三轮：最终确认。若仍有源码包下载失败则报错退出
          echo "=== 第三轮：最终确认 ==="
          make download -j$(nproc) V=s
        timeout-minutes: 60

      - name: Compile firmware
        run: |
          nproc
          make -j$(nproc) V=s
        timeout-minutes: 180

      - name: List built images
        run: |
          echo "=== 编译产物 ==="
          find bin/targets/mediatek/filogic/ -type f \( -name "*ax3000t*" -o -name "*manifest*" -o -name "sha256sums" \) -exec ls -lh {} \;
          # 确认至少有一个 ax3000t stock 变体的固件文件
          FOUND=$(find bin/targets/mediatek/filogic/ -type f -name "*xiaomi_mi-router-ax3000t-squashfs-*.bin")
          if [ -z "$FOUND" ]; then
            echo "错误：未找到 AX3000T stock 固件文件！编译可能未真正生成镜像。"
            exit 1
          fi
          echo "找到固件："
          echo "$FOUND"

      - name: Prepare artifacts
        run: |
          mkdir -p firmware
          # stock 变体产物：factory.bin（首次刷入用）+ sysupgrade.bin（升级用）
          cp bin/targets/mediatek/filogic/*xiaomi_mi-router-ax3000t-squashfs-factory.bin firmware/ 2>/dev/null || true
          cp bin/targets/mediatek/filogic/*xiaomi_mi-router-ax3000t-squashfs-sysupgrade.bin firmware/ 2>/dev/null || true
          # 清单和校验
          cp bin/targets/mediatek/filogic/sha256sums firmware/ 2>/dev/null || true
          cp bin/targets/mediatek/filogic/*.manifest firmware/ 2>/dev/null || true
          ls -lh firmware/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ax3000t-stock-firmware
          path: firmware/
          retention-days: 30

      - name: Upload full bin directory (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ax3000t-stock-bin-debug
          path: bin/
          retention-days: 7
