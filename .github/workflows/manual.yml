name: Build AX3000T Firmware

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      config:
        description: '选择配置文件'
        required: true
        type: choice
        default: 'mt7981-ax3000.config'
        options:
          - 'mt7981-ax3000.config'
          - 'mt7981-ax3000_dae.config'
      release:
        description: '是否发布到 Release'
        required: false
        type: boolean
        default: true

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: ${{ github.event.inputs.config }}
  TZ: Asia/Shanghai

jobs:
  build:
    name: 🔨 Build AX3000T
    runs-on: ubuntu-22.04

    steps:
      - name: 🙌 Checkout
        uses: actions/checkout@v4

      - name: 🪠 Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 🛠️ Init Environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev \
            lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 🪜 Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: ⚙️ Setup ccache & DL cache
        uses: actions/cache@v4
        with:
          path: |
            /workdir/.ccache
            /workdir/openwrt/dl
          key: ${{ runner.os }}-ax3000t-${{ env.REPO_BRANCH }}-${{ env.CONFIG_FILE }}
          restore-keys: |
            ${{ runner.os }}-ax3000t-${{ env.REPO_BRANCH }}-

      - name: 🔧 Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=cache_dir=/workdir/.ccache
          ccache --set-config=compression=true
          ccache -z

      - name: 🧬 Update & Install feeds
        run: |
          cd /workdir/openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 🧩 Load config
        run: |
          cd /workdir/openwrt
          cp -f defconfig/$CONFIG_FILE .config
          make defconfig

      - name: 📥 Download sources
        run: |
          cd /workdir/openwrt
          make download -j$(nproc)

      - name: 🔨 Build Firmware
        id: compile
        run: |
          cd /workdir/openwrt
          if ! make -j$(nproc) CC="ccache gcc" CXX="ccache g++"; then
            echo "⚠️ Multi-threaded failed, retrying single-threaded..."
            make -j1 V=s
          fi
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📦 Collect artifacts
        if: steps.compile.outputs.status == 'success'
        run: |
          mkdir -p $GITHUB_WORKSPACE/firmware
          cd /workdir/openwrt/bin/targets/mediatek/filogic/
          # 只挑 AX3000T 的固件和 manifest
          cp -v *xiaomi_mi-router-ax3000t* $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
          ls -lh $GITHUB_WORKSPACE/firmware/

      - name: 🪄 Upload artifacts
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T_${{ env.CONFIG_FILE }}_${{ github.run_id }}
          path: ${{ github.workspace }}/firmware/*

      - name: 📌 Generate Release Tag
        id: tag
        if: steps.compile.outputs.status == 'success' && github.event.inputs.release == 'true'
        run: |
          BUILD_TIME=$(date +"%Y%m%d-%H%M")
          echo "release_tag=AX3000T-${BUILD_TIME}" >> $GITHUB_OUTPUT
          cat > release.txt << EOF
          ## AX3000T ImmortalWrt 24.10 (内核 6.6)

          - 配置: $CONFIG_FILE
          - 分支: $REPO_BRANCH
          - 编译时间: $(date +"%Y-%m-%d %H:%M:%S")

          ## 文件说明
          - *sysupgrade.bin: 从已刷 OpenWrt/ImmortalWrt 系统升级用
          - *factory.bin: 从原厂 uboot 刷入（如果有）
          - *stock*: 兼容原厂分区版本
          EOF

      - name: 📤 Upload to Release
        if: steps.tag.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ github.workspace }}/firmware/*

      - name: 🚧 Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 5
